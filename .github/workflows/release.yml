name: Release

# Push a tag like v0.1.0 to publish a release with prebuilt binaries.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Builds run the dependencies' build scripts, so this job gets a read-only
  # token and doesn't keep it in .git/config. Only publish can write.
  build:
    runs-on: ubuntu-latest
    env:
      # Static musl binaries run on any distro. The dependencies are pure
      # Rust, so rust-lld can link the arm64 one without a cross toolchain.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version" >&2; exit 1; }
      - name: Build and package
        run: |
          for arch in x86_64 aarch64; do
            cargo build --release --locked --target "$arch-unknown-linux-musl"
            dir="dist/vinowatch"
            rm -rf "$dir" && mkdir -p "$dir"
            cp "target/$arch-unknown-linux-musl/release/vinowatch" vinowatch.service install.sh "$dir"
            tar -czf "dist/vinowatch-$arch-linux.tar.gz" -C dist vinowatch
          done
          # install.sh checks the tarball it downloads against this.
          cd dist && sha256sum vinowatch-*-linux.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes dist/*.tar.gz dist/SHA256SUMS
