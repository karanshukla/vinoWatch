# The 7-day cooldown keeps a freshly compromised release out of a PR until the
# ecosystem has had time to notice. Security updates bypass the cooldown.
# Nothing auto-merges.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      # Our own crate, released from karanshukla/vinoUserInterface.
      exclude: ["vino-user-interface"]
    # Minor and patch bumps travel together; a major bump gets its own PR.
    groups:
      # A dependency takes the first group it matches: the vino theme gets a
      # PR of its own on the next Monday run, with no week's wait, whatever
      # the version step (its 0.x minors are its breaking releases).
      vino-user-interface:
        patterns: ["vino-user-interface"]
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # zbus follows ksni's major version (Cargo.toml says why); bump both
    # together by hand once ksni moves.
    ignore:
      - dependency-name: zbus
        update-types: ["version-update:semver-major"]

  # Actions stay pinned to commit SHAs; Dependabot bumps the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
